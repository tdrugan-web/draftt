# Draftt skill catalog. The single source of truth for which skills exist.
# The skill linter and flow validator check every skill name against this file.
# status: planned | draft | shipped
# A skill folder must exist for draft and shipped skills, and must not exist for planned ones.

plugins:
  draftt-core: Shared skills, flow skills, agents, and hooks every Draftt plugin relies on
  draftt-product: Define, Deliver and Launch, and Lead skills
  draftt-ux: Discover research, Design, and Validate skills
  draftt-market: Market stage skills, from competition to go-to-market

skills:
  # Core
  - { name: draftt-context, plugin: draftt-core, stage: core, phase: 1, status: draft }
  - { name: strategic-critique, plugin: draftt-core, stage: core, phase: 1, status: draft }
  - { name: stakeholder-update, plugin: draftt-core, stage: core, phase: 6, status: planned }
  - { name: meeting-to-actions, plugin: draftt-core, stage: core, phase: 6, status: planned }
  - { name: idea-to-prd, plugin: draftt-core, stage: core, phase: 1, status: draft, flow: true }
  - { name: idea-to-market, plugin: draftt-core, stage: core, phase: 5, status: planned, flow: true }

  # Discover
