name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install checker dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test the checkers
        run: python -m pytest -q
        working-directory: scripts/tests

      - name: Lint skills
        run: python scripts/lint_skills.py

      - name: Validate flows
        run: python scripts/validate_flows.py

      - name: Validate example team config
        run: python scripts/validate_config.py config/draftt.config.example.md

      - name: No em dashes anywhere
        run: |
          if grep -rIn --exclude-dir=.git $'\u2014' .; then
            echo "Em dashes found. Use commas, periods, colons, or parentheses."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code for manifest validation
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate . --strict
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict
          done

      # Evals (claude plugin eval) make paid model calls, so they run locally, not in CI.
